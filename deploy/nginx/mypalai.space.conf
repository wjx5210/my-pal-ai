# Plain HTTP only redirects to the canonical HTTPS origin. HSTS deliberately
# lives in the HTTPS server below because browsers ignore it over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name mypalai.space www.mypalai.space;

    return 301 https://mypalai.space$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name mypalai.space www.mypalai.space;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mypalai.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypalai.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    if ($host = www.mypalai.space) {
        return 301 https://mypalai.space$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }
}
